[project]
name = "recipebox"
version = "0.1.0"
description = "A recipe management application"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "fastapi",
    "uvicorn[standard]",
    "pydantic",
    "pydantic-settings",
    "httpx",
    "pydantic[email]",
    "passlib[bcrypt]",
    "pyjwt",
    "python-multipart",
    "pwdlib[bcrypt]",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"
[tool.ruff]
line-length = 120
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "N", "UP", "B", "C4", "SIM", "RUF"]
# E = pycodestyle errors
# F = pyflakes (undefined names, unused imports)
# I = isort (import ordering)
# N = naming conventions
# UP = pyupgrade (modernize syntax)
# B = bugbear (common bugs and design problems)
# C4 = flake8-comprehensions
# SIM = flake8-simplify
# RUF = ruff-specific rules

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.pyright]
include = ["src"]

[tool.uv]
dev-dependencies = [
    "pytest",
    "pytest-asyncio",
    "ruff",
    "pyright",
    "httpx",
    "pre-commit>=4.6.0",
]
