[project]
name = "recipebox"
version = "0.1.0"
description = "A recipe management application"
requires-python = ">=3.12"
dependencies = [
    "fastapi[standard]",
    "uvicorn[standard]",
    "pydantic",
    "pydantic-settings",
    "httpx",
    "pydantic[email]",
    "passlib[bcrypt]",
    "pyjwt",
    "python-multipart",
    "pwdlib[bcrypt]",
    "recipe-scrapers",
    "truststore>=0.10.4",
    "asyncpg>=0.31.0",
    "alembic>=1.18.4",
    "sqlmodel>=0.0.38",
    "pgvector>=0.3.6",
    "openai>=1.55.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"
[tool.ruff]
line-length = 120
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "N", "UP", "B", "C4", "SIM", "RUF"]
# E = pycodestyle errors
# F = pyflakes (undefined names, unused imports)
# I = isort (import ordering)
# N = naming conventions
# UP = pyupgrade (modernize syntax)
# B = bugbear (common bugs and design problems)
# C4 = flake8-comprehensions
# SIM = flake8-simplify
# RUF = ruff-specific rules

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
addopts = "-m 'not real'"
markers = ["real: hits a real URL — excluded from normal runs, use -m real to run"]

[tool.pyright]
include = ["src"]

[dependency-groups]
dev = [
    "pytest",
    "pytest-asyncio",
    "ruff",
    "pyright",
    "httpx",
    "pre-commit>=4.6.0",
    "asyncpg-stubs>=0.31.2",
]
