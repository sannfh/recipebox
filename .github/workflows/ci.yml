name: CI
on: [push, pull_request]

jobs:
    check: 
        runs-on: ubuntu-latest
        steps:
            - uses: actions/checkout@v4
            - uses: astral-sh/setup-uv@v3
            - run: uv sync --frozen
            - run: uv run ruff check .
            - run: uv run pyright
            - run: uv run pytest