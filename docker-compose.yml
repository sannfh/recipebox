services:
  db:
    image: pgvector/pgvector:pg17
    environment:
      POSTGRES_DB: recipebox
      POSTGRES_USER: recipebox_user
      POSTGRES_PASSWORD: ${DB_PASSWORD}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U recipebox_user -d recipebox"]
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5

  app:
    build: .
    ports:
      - "8000:8000"
    environment:
      APP_DATABASE_URL: postgresql+asyncpg://recipebox_user:${DB_PASSWORD}@db/recipebox
      APP_SECRET_KEY: ${APP_SECRET_KEY}
      APP_OPENAI_API_KEY: ${APP_OPENAI_API_KEY}
      APP_ANTHROPIC_API_KEY: ${APP_ANTHROPIC_API_KEY}
      APP_REDIS_URL: redis://redis:6379/0
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy

volumes:
  postgres_data:
